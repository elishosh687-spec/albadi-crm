name: Bulk Personalized Outreach

# ⛔ THE DAILY SCHEDULE IS DELIBERATELY REMOVED (2026-08-16). Manual only.
#
# This job composes an LLM-written marketing message per lead and WhatsApps it,
# up to 60 customers a day, with no toggle in the bot settings screen. It had
# been failing every morning for 8+ days on `bridge /v1/messages 401 invalid
# bearer token` — production sends go through GreenAPI now, and the bridge
# token is dead — so it aborted after 3 consecutive failures and reached
# nobody. It still burned an OpenAI call per attempt, every day.
#
# The danger was the asymmetry: it delivered zero value while broken, but the
# moment anyone renewed BRIDGE_TENANT_TOKEN for an unrelated reason it would
# have silently begun mass-messaging the customer base, unreviewed.
#
# BEFORE RE-ENABLING: (1) point it at GreenAPI instead of the bridge, (2) put
# it behind a bot-settings toggle like every other customer-facing sender, and
# (3) dry-run it first — the dry_run input below sends nothing and writes
# nothing. The eligibility rules live in scripts/cron-bulk-personalized.ts and
# currently skip only WON / LOST / factory-wait / bot-paused leads.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no sends, no DB writes)"
        type: boolean
        default: true

jobs:
  outreach:
    runs-on: ubuntu-latest
    # Allow up to 5h — script sleeps 5 min per lead, so 60 leads max under this.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run bulk outreach
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRIDGE_BASE: ${{ secrets.BRIDGE_BASE }}
          BRIDGE_TENANT_TOKEN: ${{ secrets.BRIDGE_TENANT_TOKEN }}
          BOT_SECRET: ${{ secrets.BOT_SECRET }}
          BRIDGE_WEBHOOK_SECRET: ${{ secrets.BRIDGE_WEBHOOK_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "=== DRY RUN ==="
            npx tsx scripts/cron-bulk-personalized.ts
          else
            npx tsx scripts/cron-bulk-personalized.ts --confirm
          fi
